    style: "floating"
    search: true
    contents:
      - text: "Home"
        href: https://sarkadava.github.io/FLESH_Effort/
      - text: "Overview of Methods"
        href: Manuscript/Methods.qmd
      - text: "Preregistration deviations"
        href: Manuscript/Prereg-deviations.qmd
        
      - section: "A. Pre-processing"
        contents:
          - 01_XDF_processing/01_Process_XDF.ipynb
          - 01_XDF_processing/02_Audiosync.ipynb
          - 01_XDF_processing/03_Correct_cuts.ipynb
          - 01_XDF_processing/04_Final_wrangle.ipynb

      - section: "B. Motion tracking"
        contents:
          - 02_MotionTracking_processing/01_Video_preparation.ipynb
          - 02_MotionTracking_processing/02_Track_OpenPose.ipynb
          - 02_MotionTracking_processing/03_Track_pose2sim_OpenSim.ipynb

      - section: "C. Data processing"
        contents:
          - 03_TS_processing/01_TS_processing_motion.ipynb
          - 03_TS_processing/02_TS_processing_acoustics.ipynb
          - 03_TS_processing/03_TS_merging.ipynb

      - section: "D. Feature extraction"
        contents:
          - 04_ConceptSimilarity/ConceptNet_similarity.ipynb
          - 05_TS_featureExtraction/00_Condition_adherence.ipynb
          - 05_TS_featureExtraction/00_Speech_check.ipynb
          - 05_TS_featureExtraction/01_TS_extraction.ipynb
          - 05_TS_featureExtraction/02_Explorations_and_viz.ipynb
      - section: "E. Analysis"
        contents:
          - 06_Analysis_Modeling/Bayesian_modeling.qmd
      - section: "F. Extended results"
        contents:
          - Manuscript/Results-extended.qmd
        

  navbar:
    tools:
      - icon: github
        menu:
          - text: Source Code
            href:  https://github.com/sarkadava/FLESH_Effort
          - text: Report a Bug
            href:  https://github.com/sarkadava/FLESH_Effort/issues

metadata:
  crossref:
    chapters: true

format:
  html:
    theme: cosmo
    highlight-style: github
    css: style.css
    max-width: 1300px

# Default execution: run and show code in HTML
execute:
  enabled: false
  freeze: false
  warning: false
  message: false
  cache: false                





