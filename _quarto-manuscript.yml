# _quarto-manuscript.yml
# Profile for PDF manuscript output.
# Activated with: quarto render --profile manuscript
#
# What this does vs the default:
#   - Switches project type to book (gives proper chapter structure for PDF)
#   - Outputs PDF via LaTeX (or typst if preferred)
#   - Globally hides all code (echo: false, eval: false)
#   - Tutorial-only sections are excluded via the chapters list below
#   - Output goes to _manuscript/ not docs/

project:
  type: book
  output-dir: _manuscript

book:
  title: "Effort"
  author:
    - name: Šárka Kadavá
      affiliations: Donders Centre for Cognition

  date: today
  chapters:                              # abstract / title page
    - Manuscript/Print_index.qmd        # full text
    - Manuscript/Introduction.qmd           # full text (overview only, no sub-tutorials)
    - Manuscript/Methods.qmd       # overview only
    - Manuscript/Results.qmd     # overview only
    - Manuscript/Discussion.qmd            # overview only
    - Manuscript/References.qmd
  # The sub-chapters (02a, 02b, 03a, etc.) are tutorial detail pages —
  # intentionally NOT listed here so they don't appear in the manuscript.

format:
  pdf:
    documentclass: book
    classoption: [12pt, a4paper]
    geometry: margin=2.5cm
    number-sections: true
    toc: false                 # journals usually don't want a TOC
    keep-tex: false
    include-in-header:
      text: |
        \usepackage{lineno}
        \linenumbers          % line numbers for peer review
    # Uncomment for typst instead of LaTeX (faster, no TeX install needed):
    # format: typst

# In the manuscript profile, never show or run code
execute:
  echo: false
  eval: false
  include: false               # suppresses all code output (figures still shown if pre-computed)
